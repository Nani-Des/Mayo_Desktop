<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayo Dashboard</title>

    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
      }

      .dashboard-container {
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      }

      h1 {
        margin-bottom: 20px;
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
      }

      button:hover {
        background-color: #45a049;
      }

      #dataSharingSection {
        margin-top: 20px;
        display: none;
        border-top: 1px solid #ddd;
        padding-top: 20px;
      }

      .sharing-option {
        margin: 10px 0;
        padding: 12px;
        border: 1px dashed #888;
        border-radius: 8px;
        background-color: #fafafa;
      }

      .device-list {
        margin-top: 15px;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 6px;
        background-color: #fff;
      }

      .device-item {
        padding: 10px 12px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .device-item:last-child {
        border-bottom: none;
      }

      .device-name {
        font-weight: 500;
        color: #333;
      }

      .device-address {
        font-size: 12px;
        color: #666;
      }

      .device-connect-btn {
        padding: 6px 12px;
        font-size: 12px;
        background-color: #2196F3;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .device-connect-btn:hover {
        background-color: #1976D2;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
      }

      .no-devices {
        text-align: center;
        padding: 20px;
        color: #999;
      }

      /* Pairing Confirmation Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 30px;
        max-width: 450px;
        width: 90%;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      .modal-content h2 {
        margin-top: 0;
        color: #333;
      }

      .pairing-code {
        font-size: 36px;
        font-weight: bold;
        color: #2196F3;
        letter-spacing: 4px;
        margin: 20px 0;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 8px;
      }

      .modal-instructions {
        color: #666;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      .modal-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
      }

      .modal-btn {
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .modal-btn-confirm {
        background-color: #4CAF50;
        color: white;
      }

      .modal-btn-confirm:hover {
        background-color: #45a049;
      }

      .modal-btn-confirm:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .modal-btn-cancel {
        background-color: #f44336;
        color: white;
      }

      .modal-btn-cancel:hover {
        background-color: #d32f2f;
      }

      .modal-error {
        color: #f44336;
        margin-top: 15px;
        font-size: 14px;
      }

      .device-class {
        font-size: 11px;
        color: #888;
      }
    </style>
  </head>

  <body>
    <div class="dashboard-container">
      <h1>Welcome, <span id="userName">User</span></h1>

      <button id="dataSharingBtn">Data Sharing</button>

      <div id="dataSharingSection">
        <div class="sharing-option">
          <h3>Bluetooth Sharing</h3>
          <p>Click to start Bluetooth transfer</p>
          <button id="bluetoothBtn">Start Bluetooth</button>
          <div id="bluetoothDeviceList" class="device-list" style="display: none;"></div>
        </div>

        <div class="sharing-option">
          <h3>QR Code Sharing</h3>
          <p>Click to generate QR code</p>
          <button id="qrCodeBtn">Generate QR</button>
        </div>
      </div>
    </div>

    <!-- Pairing Confirmation Modal -->
    <div id="pairingModal" class="modal-overlay">
      <div class="modal-content">
        <h2>Bluetooth Pairing</h2>
        <p id="pairingDeviceName" class="modal-instructions"></p>
        <div id="pairingCodeDisplay" class="pairing-code"></div>
        <p id="pairingInstructions" class="modal-instructions">
          Please check your iPhone and confirm the pairing code matches, then tap "Pair" on your device.
        </p>
        <div class="modal-buttons">
          <button id="confirmPairingBtn" class="modal-btn modal-btn-confirm">
            Yes, I've Confirmed
          </button>
          <button id="cancelPairingBtn" class="modal-btn modal-btn-cancel">
            Cancel
          </button>
        </div>
        <div id="pairingError" class="modal-error"></div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
